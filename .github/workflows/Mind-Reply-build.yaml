# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: public

jobs:
# Please do not rename this job
  build-project:
    name: build Mind-Reply
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x
            - name: Upload a Build Artifact
  uses: actions/upload-artifact@v7.0.1
  with:
    # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
    name: # optional, default is artifact
    # A file, directory or wildcard pattern that describes what to upload.
    path: 
    # The desired behavior if no files are found using the provided path.
Available Options:
  warn: Output a warning but do not fail the action
  error: Fail the action with an error message
  ignore: Do not output any warnings or errors, the action does not fail

    if-no-files-found: # optional, default is warn
    # Duration after which artifact will expire in days. 0 means using default retention.
Minimum 1 day. Maximum 90 days unless changed from the repository settings page.

    retention-days: # optional
    # The level of compression for Zlib to be applied to the artifact archive. The value can range from 0 to 9: - 0: No compression - 1: Best speed - 6: Default compression (same as GNU Gzip) - 9: Best compression Higher levels will result in better compression, but will take longer to complete. For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.

    compression-level: # optional, default is 6
    # If true, an artifact with a matching name will be deleted before a new one is uploaded. If false, the action will fail if an artifact for the given name already exists. Does not fail if the artifact does not exist.

    overwrite: # optional, default is false
    # If true, hidden files will be included in the artifact. If false, hidden files will be excluded from the artifact.

    include-hidden-files: # optional, default is false
    # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).

    archive: # optional, default is true
          
      - name: Build Node assets

                  - name: Application observability for AWS
  # You may pin to the exact commit or the version.
  # uses: aws-actions/application-observability-for-aws@95bb59e4538ba9ef746805d8a2bbbe531ba2a728
  uses: aws-actions/application-observability-for-aws@v1.1.1
  with:
    # The bot name to respond to in comments (e.g., @awsapm)
    bot_name: # optional, default is @awsapm
    # The branch to merge PRs into (defaults to repository default branch)
    target_branch: # optional
    # Prefix for branches created by the action (e.g., 'awsapm/', 'awsapm-')
    branch_prefix: # optional, default is awsapm/
    # Comma-separated list of GitHub usernames allowed to use this action even without write access. Empty string (default) means only users with write/admin access can use it.
    allowed_non_write_users: # optional, default is 
    # GitHub token to use for API calls. If not provided, uses the default GitHub Actions token.
    github_token: # optional, default is ${{ github.token }}
    # Custom instructions to guide the AI agent's analysis and actions
    custom_prompt: # optional, default is 
    # CLI tool to use for investigation
    cli_tool: # optional, default is claude_code
    # Path to AI agent execution output file (used to post results back to GitHub). For claude_code path, pass this from claude-code-base-action outputs in a second call to this action.
    output_file: # optional
    # Execution status from AI agent (success or failure). Only used when output_file is provided.
    output_status: # optional
    # GitHub comment ID to update with results (required for Step 3 - pass from Step 1 output: steps.prepare.outputs.awsapm_comment_id)
    comment_id: # optional
    # Enable CloudWatch MCP server for metrics, alarms, and log insights
    enable_cloudwatch_mcp: # optional, default is true
    # Enable integration test mode (internal use only)
    test_mode: # optional, default is false
                - name: Setup Cog
  # You may pin to the exact commit or the version.
  # uses: replicate/setup-cog@6a0e8a73ca5acc6eb89f950a859cb60092d5f188
  uses: replicate/setup-cog@v1.0.5
  with:
    # If present, this token is used to authenticate to Replicate using `cog login` so you can push your model.
    token: 
    # The version of Cog to install
    cog-version: # optional, default is v0.8.6
    # Install NVIDIA CUDA Toolkit to build GPU-bound containers.
    install-cuda: # optional, default is true
          
                      - name: Pangea Vault Secrets Action
  # You may pin to the exact commit or the version.
  # uses: pangeacyber/pangea-github-action-vault@6bd58b585b52c76307edc6c895dbec719c3e6668
  uses: pangeacyber/pangea-github-action-vault@1.0.2
  with:
    # Job command to run (ex - npm run dev)
    pangea_token: # optional
    # Pangea Domain
    pangea_domain: # optional, default is aws.us.pangea.cloud
    # Pangea folder to pull secrets from
    pangea_default_folder: # optional
    # Github personal access token
    github_token: 
          
        env:
          CI: true
          SITE_URL: ${{ inputs.site-url }}
        run: |
          npm ci
          npm run build
            - name: Veracode Profile Sandboxes Helper
  # You may pin to the exact commit or the version.
  # uses: veracode/veracode-sandboxes-helper@baa0a8458605b92d261b6b8f7801fa67fdce501b
  uses: veracode/veracode-sandboxes-helper@v1.0.0
  with:
    # The activity expected from the Action: clean, promote-latest-scan, remove-sandbox
    activity: # optional
    # Veracode Application name
    app-name: 
    # Sandbox name for actions related to a specific Sandbox
    sandbox-name: # optional
    # The amount of oldest scanned-in sandboxes to remove
    clean-amount: # optional, default is 1
    # Deletes the sandbox after its promotion. Only works with the [promote] activity. Default is false
    delete-on-promote: # optional, default is false
    # The number of days which the sandbox had no activity
    clean-modified-before: # optional, default is 0
          
# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: e18d4a10-131c-4ad1-8ff6-4e00f2a00e48
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/Mind-Reply/config.yaml
          action: upload
