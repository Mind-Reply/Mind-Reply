# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Mind-Reply

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: '10.0'

      - name: Build with dotnet
        run: dotnet build --configuration Release
        
- name: dotnet publish
  run: dotnet publish src/app/robots.ts -c Release -o "${{env.DOTNET_ROOT}}/myapp"
              - name: Download a Build Artifact
  uses: actions/download-artifact@v3.1.0
  with:
    # Artifact name
    name: # optional
    # Destination path
    path: # optional
          

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3FC6C89AEF50482294351E0A269A2EB5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_07FBE3E53BD44B57B144F83D442FAD17 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BC57E873353D4D89AC30C11C979DB2F5 }}
            - name: Upload a Build Artifact
  uses: actions/upload-artifact@v7.0.1
  with:
    # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
    name: # optional, default is artifact
    # A file, directory or wildcard pattern that describes what to upload.
    path: 
    # The desired behavior if no files are found using the provided path.
Available Options:
  warn: Output a warning but do not fail the action
  error: Fail the action with an error message
  ignore: Do not output any warnings or errors, the action does not fail

    if-no-files-found: # optional, default is warn
    # Duration after which artifact will expire in days. 0 means using default retention.
Minimum 1 day. Maximum 90 days unless changed from the repository settings page.

    retention-days: # optional
    # The level of compression for Zlib to be applied to the artifact archive. The value can range from 0 to 9: - 0: No compression - 1: Best speed - 6: Default compression (same as GNU Gzip) - 9: Best compression Higher levels will result in better compression, but will take longer to complete. For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.

    compression-level: # optional, default is 6
    # If true, an artifact with a matching name will be deleted before a new one is uploaded. If false, the action will fail if an artifact for the given name already exists. Does not fail if the artifact does not exist.

    overwrite: # optional, default is false
    # If true, hidden files will be included in the artifact. If false, hidden files will be excluded from the artifact.

    include-hidden-files: # optional, default is false
    # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).

    archive: # optional, default is true            - name: Upload a Build Artifact
  uses: actions/upload-artifact@v7.0.1
  with:
    # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
    name: # optional, default is artifact
    # A file, directory or wildcard pattern that describes what to upload.
    path: 
    # The desired behavior if no files are found using the provided path.
Available Options:
  warn: Output a warning but do not fail the action
  error: Fail the action with an error message
  ignore: Do not output any warnings or errors, the action does not fail

    if-no-files-found: # optional, default is warn
    # Duration after which artifact will expire in days. 0 means using default retention.
Minimum 1 day. Maximum 90 days unless changed from the repository settings page.

    retention-days: # optional
    # The level of compression for Zlib to be applied to the artifact archive. The value can range from 0 to 9: - 0: No compression - 1: Best speed - 6: Default compression (same as GNU Gzip) - 9: Best compression Higher levels will result in better compression, but will take longer to complete. For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.

    compression-level: # optional, default is 6
    # If true, an artifact with a matching name will be deleted before a new one is uploaded. If false, the action will fail if an artifact for the given name already exists. Does not fail if the artifact does not exist.

    overwrite: # optional, default is false
    # If true, hidden files will be included in the artifact. If false, hidden files will be excluded from the artifact.

    include-hidden-files: # optional, default is false
    # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).

    archive: # optional, default is true
          
                      - name: First interaction
  uses: actions/first-interaction@v1.3.0
  with:
    # Token for the repository. Can be passed in using {{ secrets.GITHUB_TOKEN }}
    repo-token: 
    # Comment to post on an individual's first issue
    issue-message: # optional
    # Comment to post on an individual's first pull request
    pr-message: # optional
                      - name: Add comment to Asana Task
  # You may pin to the exact commit or the version.
  # uses: Asana/comment-on-task-github-action@c0947e8462e93e32f5baa70b1ac983905258b53a
  uses: Asana/comment-on-task-github-action@v1.2
  with:
    # The Asana secret for the action. Read more about how to generate this secret at https://github.com/Asana/create-app-attachment-github-action#step-2-set-up-a-repository-secret-for-the-secret-token
    asana-secret: # default is 
    # List of allowed projects. The action will only add comments to tasks in these projects. Only one of allowed-projects or blocked-projects can be specified.
    allowed-projects: # optional, default is 
    # List of allowed projects. The action will not add comments to tasks or subtasks of tasks in any of these projects. Only one of allowed-projects or blocked-projects can be specified.
    blocked-projects: # optional, default is 
    # What comment the action should use. Learn how to customize this message at https://github.com/Asana/create-app-attachment-github-action#step-2-set-up-a-repository-secret-for-the-secret-token
    comment-text: # default is 
                      - name: go-task/setup-task
  # You may pin to the exact commit or the version.
  # uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa
  uses: go-task/setup-task@v2.1.0
  with:
    # Version to use. Example: 3.4.2
    version: # default is 3.x
    # Token with permissions to do repo things
    repo-token: # optional, default is ${{ github.token }}
    # Maximum number of retry attempts for HTTP requests
    max-retries: # optional, default is 3
                      - name: Add To GitHub projects
  uses: actions/add-to-project@v2.0.0
  with:
    # URL of the project to add issues to
    project-url: 
    # A GitHub personal access token with write access to the project
    github-token: 
    # A comma-separated list of labels to use as a filter for issue to be added
    labeled: # optional
    # The behavior of the labels filter, AND to match all labels, OR to match any label, NOT to exclude any listed label (default is OR)
    label-operator: # optional
                      - name: Setup Cog
  # You may pin to the exact commit or the version.
  # uses: replicate/setup-cog@6a0e8a73ca5acc6eb89f950a859cb60092d5f188
  uses: replicate/setup-cog@v1.0.5
  with:
    # If present, this token is used to authenticate to Replicate using `cog login` so you can push your model.
    token: 
    # The version of Cog to install
    cog-version: # optional, default is v0.8.6
    # Install NVIDIA CUDA Toolkit to build GPU-bound containers.
    install-cuda: # optional, default is true
                      - name: Custom Models Action
  # You may pin to the exact commit or the version.
  # uses: datarobot-oss/custom-models-action@0a5d55659824973261d6b49389569dd4e28795bf
  uses: datarobot-oss/custom-models-action@v1.6.0
  with:
    # DataRobot authentication API token.
    api-token: 
    # DataRobot frontend web server.
    webserver: 
    # The branch for which pull request and push events will trigger the action.
    branch: 
    # Determines the namespace under which models and deployments will be created, updated and
deleted.

    namespace: # optional
    # Whether to detected local deleted model definitions and consequently delete them
in DataRobot.

    allow-model-deletion: # optional, default is false
    # Whether to detect local deleted deployment definitions and consequently delete them
in DataRobot.

    allow-deployment-deletion: # optional, default is false
    # Whether to handle custom inference models only, without deployments..

    models-only: # optional, default is false
    # Whether a request to an HTTPS URL will be made without a certificate verification.

    skip-cert-verification: # optional, default is false
          
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Mind-Reply'
          slot-name: 'Production'
          package: .
          
